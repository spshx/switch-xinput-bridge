name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # vgamepad is sdist-only and its setup.py launches the ViGEmBus MSI when
      # the driver is missing (blocking on CI), so unpack its source onto the path
      # instead of pip installing (or pip downloading) it.
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --no-deps -e .
          python -m pip install hidapi pytest pyinstaller
          mkdir vgsrc
          curl -sSL -o vgsrc/vgamepad.tar.gz https://files.pythonhosted.org/packages/source/v/vgamepad/vgamepad-0.1.0.tar.gz
          echo "57f6bd01aec0c172947517fb782d150ef9b285f7f4d524c317374fa5c24a89de  vgsrc/vgamepad.tar.gz" | sha256sum -c -
          tar xzf vgsrc/vgamepad.tar.gz -C vgsrc
          echo "PYTHONPATH=$GITHUB_WORKSPACE/vgsrc/vgamepad-0.1.0" >> "$GITHUB_ENV"
      - run: python -m pytest
      - name: Build standalone exe
        run: python scripts/build_exe.py
      - name: Smoke test exe
        run: dist/switch-xinput-bridge.exe --version
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/switch-xinput-bridge.exe
          --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
