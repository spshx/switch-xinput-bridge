name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # vgamepad's setup.py launches the ViGEmBus MSI when the driver is missing,
      # which blocks forever on CI. The tests don't need it, so skip it here.
      - run: python -m pip install --no-deps -e . && python -m pip install hidapi pytest
        shell: bash
      - run: python -m pytest -v
      - name: CLI smoke test
        run: |
          switch-xinput-bridge --version
          switch-xinput-bridge --help
